[build]
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Canonical app is the Render Web Service (SPA + API same-origin).
# Keep this redirect so papstock.netlify.app does not serve a broken split front.
[[redirects]]
  from = "/*"
  to = "https://papastock.onrender.com/:splat"
  status = 301
  force = true
