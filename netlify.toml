[build]
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Same-origin /api for the Netlify SPA. The browser talks to papstock.netlify.app;
# Netlify rewrites to the Render API so cookies stay first-party and SameSite=Strict works.
[[redirects]]
  from = "/api/*"
  to = "https://papastock.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
